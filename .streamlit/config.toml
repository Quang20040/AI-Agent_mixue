[theme]
base = "light"
primaryColor = "#E60012"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#18202D"
font = "sans serif"

[server]
# Serve src/dashboard/static/ at /app/static/ so images are downloaded once and cached.
enableStaticServing = true
# Compress the websocket stream (page HTML is resent on every interaction).
enableWebsocketCompression = true
# Phone photos are normalized after upload; allow full-size originals.
maxUploadSize = 40

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
