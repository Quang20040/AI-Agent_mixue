name: Keep Render demo awake

# Render Free puts the service to sleep after 15 idle minutes and the next visit waits ~1 minute.
# A ping every 10 minutes keeps it warm. One always-on service uses ~744 of the 750 free hours a month.
# Disable this workflow (Actions tab → … → Disable workflow) when the demo is not needed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_URL: ${{ vars.RENDER_URL || 'https://mixue-beverageops-demo.onrender.com' }}
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$RENDER_URL/_stcore/health"
