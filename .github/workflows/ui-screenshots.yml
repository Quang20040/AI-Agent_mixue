name: UI screenshots

on:
  push:
    branches: [ "feat/**" ]
    paths: [ "src/dashboard/**", "scripts/ui_screenshots.py", ".github/workflows/ui-screenshots.yml" ]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Capture
        env:
          PYTHONPATH: .
        run: python scripts/ui_screenshots.py ui_screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui_screenshots/
