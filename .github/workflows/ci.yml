name: BeverageOps AI CI Pipeline

on:
  push:
    branches: [ main, master, "fix/**", "feat/**", "feature/**" ]
  pull_request:
    branches: [ main, master, "fix/**" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/ --statistics

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify System Healthcheck
        run: |
          python scripts/healthcheck.py

  docker-production-smoke:
    # Same image and start-up path as Render: root-owned disk at /var/data, production mode.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t beverageops:ci .

      - name: Start container with a root-owned persistent disk
        run: |
          docker volume create mixue-data
          docker run -d --name app -p 8501:8501 -v mixue-data:/var/data \
            -e APP_ENV=production -e APP_DEMO_MODE=false -e PERSIST_DIR=/var/data \
            -e OWNER_USERNAME=chuquan_ci -e OWNER_INITIAL_PASSWORD='CI-only-password-2132' \
            beverageops:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker logs app 2>&1 | tail -20

      - name: Data lands on the disk and the owner was provisioned
        run: |
          docker logs app 2>&1 | grep "Owner bootstrap: PROVISIONED"
          docker exec app sh -c 'ls -la /var/data && test -f /var/data/beverageops.db && test -f /var/data/shift_reports.json'
          test "$(docker exec app stat -c %U /proc/1)" = appuser   # app runs unprivileged
          # Images are served as cached static files (not base64 inside every page).
          curl -fsS -o /dev/null -w "static image %{http_code} %{content_type} %{size_download}B\n" http://localhost:8501/app/static/snow-king-cutout.webp
          # Same port also serves the REST API and the web frontend.
          curl -fsS http://localhost:8501/api/v1/health
          curl -fsS -o /dev/null -w "api docs %{http_code}\n" http://localhost:8501/api/docs
          curl -fsS http://localhost:8501/ui/ | grep -q 'app.js'
          curl -fsS -o /dev/null -w "frontend js %{http_code} %{content_type}\n" http://localhost:8501/ui/app.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/api/v1/me)" = 401
          # The page itself must initialise (store identity, DB, agent), not just the health endpoint.
          docker exec -w /app -e PYTHONPATH=/app app python -c "from src.database import SessionLocal; from src.runtime_settings import resolve_store_id; db = SessionLocal(); print('store', resolve_store_id(db))"

      - name: Browser smoke (Streamlit websocket + web frontend + API) on the same server
        run: |
          docker run -d --name demo -p 8502:8501 -e APP_ENV=development -e APP_DEMO_MODE=true -e LLM_ENABLED=false beverageops:ci
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          for i in $(seq 1 60); do curl -fsS http://localhost:8502/_stcore/health && break; sleep 2; done
          SMOKE_SHOTS=smoke-shots python scripts/ci/browser_smoke.py http://localhost:8502 || (docker logs demo 2>&1 | tail -40; exit 1)
          docker rm -f demo

      - name: UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: smoke-shots/
          if-no-files-found: ignore

      - name: Restart keeps the owner password (no re-provisioning)
        run: |
          docker restart app
          sleep 15
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 2; done
          docker logs app 2>&1 | grep "Owner bootstrap: EXISTS"

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -60 || true

  postgres-migration-smoke:
    # SQLite on the disk -> PostgreSQL on first start, verified; then the app runs on PostgreSQL.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t beverageops:ci .

      - name: Shop running on SQLite (sample history kept, so every table has rows)
        run: |
          docker network create mixue
          docker volume create mixue-data
          docker run -d --name sqlite-app --network mixue -v mixue-data:/var/data -e PERSIST_DIR=/var/data \
            -e APP_ENV=development -e APP_DEMO_MODE=true -e KEEP_SAMPLE_DATA=true -e LLM_ENABLED=false beverageops:ci
          for i in $(seq 1 60); do docker exec sqlite-app curl -fsS http://localhost:8501/_stcore/health && break; sleep 2; done
          docker rm -f sqlite-app

      - name: Same disk + PostgreSQL -> one verified copy
        run: |
          docker run -d --name pg --network mixue -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=beverageops postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker run -d --name app --network mixue -p 8503:8501 -v mixue-data:/var/data -e PERSIST_DIR=/var/data \
            -e DATABASE_URL=postgresql://postgres:ci@pg:5432/beverageops \
            -e APP_ENV=development -e APP_DEMO_MODE=true -e LLM_ENABLED=false beverageops:ci
          for i in $(seq 1 90); do curl -fsS http://localhost:8503/_stcore/health && break; sleep 2; done
          docker logs app 2>&1 | grep -E "\[pg\]|OK$|Migration committed"
          docker logs app 2>&1 | grep -q "Migration committed; all copied fields verified."
          docker exec pg psql -U postgres -d beverageops -tAc "select count(*) from sales_daily" | grep -qv '^0$'
          docker exec pg psql -U postgres -d beverageops -tAc "select count(*) from users"

      - name: App works on PostgreSQL (API + browser)
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8503/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"quanly","password":"123"}' | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:8503/api/v1/stores/2132/sales/daily?days=7&end=2026-10-15" | python -c 'import sys,json;d=json.load(sys.stdin)["days"];assert any(r["pos_sku_revenue_vnd"] for r in d), d;print("sales/daily on postgres:", len(d), "days")'
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:8503/api/v1/stores/2132/stock-matrix?year=2026&month=10" > /dev/null
          curl -fsS -H "Authorization: Bearer $TOKEN" -o /tmp/backup.zip http://localhost:8503/api/v1/stores/2132/backup
          python -c "import zipfile;n=zipfile.ZipFile('/tmp/backup.zip').namelist();assert 'database/sales_daily.csv' in n, n;print('backup has', len(n), 'files')"
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"confirm": true}' http://localhost:8503/api/v1/stores/2132/sample-data/purge | python -c 'import sys,json;r=json.load(sys.stdin);print("purged on postgres:", r["deleted"]);assert r["deleted"]["sales_daily"] > 3000'
          docker exec pg psql -U postgres -d beverageops -tAc "select count(*) from sales_daily" | grep -qx 39
          docker exec pg psql -U postgres -d beverageops -tAc "select count(*) from recipe_bom" | grep -qx 120
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          python scripts/ci/browser_smoke.py http://localhost:8503

      - name: Restart does not copy again
        run: |
          docker restart app
          for i in $(seq 1 60); do curl -fsS http://localhost:8503/_stcore/health && break; sleep 2; done
          docker logs app 2>&1 | grep "already holds data"

      - name: Logs
        if: always()
        run: docker logs app 2>&1 | tail -80 || true
