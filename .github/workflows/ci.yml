name: BeverageOps AI CI Pipeline

on:
  push:
    branches: [ main, master, "fix/**", "feat/**", "feature/**" ]
  pull_request:
    branches: [ main, master, "fix/**" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/ --statistics

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify System Healthcheck
        run: |
          python scripts/healthcheck.py

  docker-production-smoke:
    # Same image and start-up path as Render: root-owned disk at /var/data, production mode.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t beverageops:ci .

      - name: Start container with a root-owned persistent disk
        run: |
          docker volume create mixue-data
          docker run -d --name app -p 8501:8501 -v mixue-data:/var/data \
            -e APP_ENV=production -e APP_DEMO_MODE=false -e PERSIST_DIR=/var/data \
            -e OWNER_USERNAME=chuquan_ci -e OWNER_INITIAL_PASSWORD='CI-only-password-2132' \
            beverageops:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker logs app 2>&1 | tail -20

      - name: Data lands on the disk and the owner was provisioned
        run: |
          docker logs app 2>&1 | grep "Owner bootstrap: PROVISIONED"
          docker exec app sh -c 'ls -la /var/data && test -f /var/data/beverageops.db && test -f /var/data/shift_reports.json'
          test "$(docker exec app stat -c %U /proc/1)" = appuser   # app runs unprivileged
          # The page itself must initialise (store identity, DB, agent), not just the health endpoint.
          docker exec -w /app -e PYTHONPATH=/app app python -c "from src.database import SessionLocal; from src.runtime_settings import resolve_store_id; db = SessionLocal(); print('store', resolve_store_id(db))"

      - name: Restart keeps the owner password (no re-provisioning)
        run: |
          docker restart app
          sleep 15
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 2; done
          docker logs app 2>&1 | grep "Owner bootstrap: EXISTS"

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -60 || true
