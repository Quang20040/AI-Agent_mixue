name: BeverageOps AI CI Pipeline

on:
  push:
    branches: [ main, master, "fix/**", "feat/**", "feature/**" ]
  pull_request:
    branches: [ main, master, "fix/**" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/ --statistics

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify System Healthcheck
        run: |
          python scripts/healthcheck.py

  docker-production-smoke:
    # Same image and start-up path as Render: root-owned disk at /var/data, production mode.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t beverageops:ci .

      - name: Start container with a root-owned persistent disk
        run: |
          docker volume create mixue-data
          docker run -d --name app -p 8501:8501 -v mixue-data:/var/data \
            -e APP_ENV=production -e APP_DEMO_MODE=false -e PERSIST_DIR=/var/data \
            -e OWNER_USERNAME=chuquan_ci -e OWNER_INITIAL_PASSWORD='CI-only-password-2132' \
            beverageops:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker logs app 2>&1 | tail -20

      - name: Data lands on the disk and the owner was provisioned
        run: |
          docker logs app 2>&1 | grep "Owner bootstrap: PROVISIONED"
          docker exec app sh -c 'ls -la /var/data && test -f /var/data/beverageops.db && test -f /var/data/shift_reports.json'
          test "$(docker exec app stat -c %U /proc/1)" = appuser   # app runs unprivileged
          # Images are served as cached static files (not base64 inside every page).
          curl -fsS -o /dev/null -w "static image %{http_code} %{content_type} %{size_download}B\n" http://localhost:8501/app/static/snow-king-cutout.webp
          # Same port also serves the REST API and the web frontend.
          curl -fsS http://localhost:8501/api/v1/health
          curl -fsS -o /dev/null -w "api docs %{http_code}\n" http://localhost:8501/api/docs
          curl -fsS http://localhost:8501/ui/ | grep -q 'app.js'
          curl -fsS -o /dev/null -w "frontend js %{http_code} %{content_type}\n" http://localhost:8501/ui/app.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/api/v1/me)" = 401
          # The page itself must initialise (store identity, DB, agent), not just the health endpoint.
          docker exec -w /app -e PYTHONPATH=/app app python -c "from src.database import SessionLocal; from src.runtime_settings import resolve_store_id; db = SessionLocal(); print('store', resolve_store_id(db))"

      - name: Browser smoke (Streamlit websocket + web frontend + API) on the same server
        run: |
          docker run -d --name demo -p 8502:8501 -e APP_ENV=development -e APP_DEMO_MODE=true -e LLM_ENABLED=false beverageops:ci
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          for i in $(seq 1 60); do curl -fsS http://localhost:8502/_stcore/health && break; sleep 2; done
          python scripts/ci/browser_smoke.py http://localhost:8502 || (docker logs demo 2>&1 | tail -40; exit 1)
          docker rm -f demo

      - name: Restart keeps the owner password (no re-provisioning)
        run: |
          docker restart app
          sleep 15
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 2; done
          docker logs app 2>&1 | grep "Owner bootstrap: EXISTS"

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -60 || true
