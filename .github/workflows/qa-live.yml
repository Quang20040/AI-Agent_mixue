name: QA live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test
        default: https://mixue-beverageops-demo.onrender.com
      mode:
        description: all | functional | shots | video | tts
        default: all

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embedding experiment
        if: github.event.inputs.mode == 'mlexp'
        run: |
          pip install -q sentence-transformers numpy
          python scripts/mlexp/embed.py mlexp_out
          cd mlexp_out && git init -q -b ml-exp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Embeddings for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ml-exp
      - name: Install
        if: github.event.inputs.mode != 'mlexp'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Web check
        if: github.event.inputs.mode == 'webcheck'
        run: |
          mkdir -p web_check && cd scripts && python web_check.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" ../web_check || true
          cd ../web_check && git init -q -b web-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Web check for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:web-check
      - name: UI check
        if: github.event.inputs.mode == 'uicheck'
        run: |
          mkdir -p ui_check && cd scripts && python ui_check.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" ../ui_check || true
          cd ../ui_check && git init -q -b ui-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "UI check for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ui-check
      - name: SOP check
        if: github.event.inputs.mode == 'sopcheck'
        run: |
          mkdir -p sop_check && cd scripts && python sop_check.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" ../sop_check || true
          cd ../sop_check && git init -q -b sop-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "SOP check for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:sop-check
      - name: OCR timing
        if: startsWith(github.event.inputs.mode, 'ocr')
        run: |
          pip install -q pillow && mkdir -p ocr_timing && cd scripts && python ocr_timing.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" ../ocr_timing "${{ github.event.inputs.mode == 'ocrclean' && '15' || '0' }}" || true
          cd ../ocr_timing && rm -f *.jpg && git init -q -b ocr-timing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "OCR timing for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ocr-timing
      - name: Narration audio
        if: github.event.inputs.mode == 'tts'
        run: |
          pip install edge-tts
          python scripts/tts/make_tts.py tts_out
          cp scripts/tts/narration.json tts_out/
          cd tts_out
          git init -q -b tts-audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Narration audio for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:tts-audio
      - name: Demo video
        if: github.event.inputs.mode == 'video'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python scripts/demo_video.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" demo_out
      - name: Upload demo video
        if: always() && github.event.inputs.mode == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            demo_out/*.mp4
            demo_out/log.json
            demo_out/error.png
          if-no-files-found: ignore
      - name: Publish demo video to demo-video branch
        if: always() && github.event.inputs.mode == 'video'
        run: |
          [ -d demo_out ] || exit 0
          cd demo_out
          rm -rf raw
          git init -q -b demo-video
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la > FILES.txt
          git add -A && git commit -q -m "Demo video for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:demo-video
      - name: Report screenshots
        if: github.event.inputs.mode == 'shots'
        run: python scripts/report_shots.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" qa_live
      - name: Run QA
        if: github.event.inputs.mode != 'shots' && github.event.inputs.mode != 'video' && github.event.inputs.mode != 'tts' && !startsWith(github.event.inputs.mode, 'ocr') && github.event.inputs.mode != 'mlexp' && github.event.inputs.mode != 'sopcheck' && github.event.inputs.mode != 'uicheck' && github.event.inputs.mode != 'webcheck'
        run: python scripts/qa_live.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" qa_live "${{ github.event.inputs.mode || 'all' }}"
      - name: Publish to qa-results branch
        if: always() && github.event.inputs.mode != 'video' && github.event.inputs.mode != 'tts' && !startsWith(github.event.inputs.mode, 'ocr') && github.event.inputs.mode != 'mlexp' && github.event.inputs.mode != 'sopcheck' && github.event.inputs.mode != 'uicheck' && github.event.inputs.mode != 'webcheck'
        run: |
          [ -d qa_live ] || exit 0
          cd qa_live
          git init -q -b qa-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Source commit: ${GITHUB_SHA}" > SOURCE.txt
          git add -A && git commit -q -m "QA live results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ github.event.inputs.mode == 'shots' && 'report-shots' || 'qa-results' }}
