name: QA live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test
        default: https://mixue-beverageops-demo.onrender.com
      mode:
        description: all | functional | shots | video
        default: all

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Demo video
        if: github.event.inputs.mode == 'video'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python scripts/demo_video.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" demo_out
      - name: Upload demo video
        if: always() && github.event.inputs.mode == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            demo_out/*.mp4
            demo_out/log.json
            demo_out/error.png
          if-no-files-found: ignore
      - name: Report screenshots
        if: github.event.inputs.mode == 'shots'
        run: python scripts/report_shots.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" qa_live
      - name: Run QA
        if: github.event.inputs.mode != 'shots' && github.event.inputs.mode != 'video'
        run: python scripts/qa_live.py "${{ github.event.inputs.url || 'https://mixue-beverageops-demo.onrender.com' }}" qa_live "${{ github.event.inputs.mode || 'all' }}"
      - name: Publish to qa-results branch
        if: always() && github.event.inputs.mode != 'video'
        run: |
          [ -d qa_live ] || exit 0
          cd qa_live
          git init -q -b qa-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Source commit: ${GITHUB_SHA}" > SOURCE.txt
          git add -A && git commit -q -m "QA live results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ github.event.inputs.mode == 'shots' && 'report-shots' || 'qa-results' }}
