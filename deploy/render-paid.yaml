# Render Blueprint TRẢ PHÍ (~7,25 USD/tháng) — bản dùng thật cho quán, có ổ đĩa bền vững.
# Dùng: Render → New → Blueprint → mục "Blueprint Path" nhập deploy/render-paid.yaml.
#
# - Gói "starter" vì chỉ gói trả phí mới gắn được ổ đĩa bền vững (persistent disk).
# - Mọi dữ liệu quán ghi ra (CSDL SQLite, báo cáo chốt ca, ảnh chứng từ, checkpoint LangGraph,
#   nhật ký audit) nằm trên ổ /var/data nên KHÔNG mất khi deploy lại.
# - Tài khoản demo (mật khẩu 123/123456) bị khóa ở production; tài khoản chủ quán được tạo
#   ở lần khởi động đầu từ OWNER_USERNAME / OWNER_INITIAL_PASSWORD và buộc đổi mật khẩu khi đăng nhập.
# Các biến "sync: false" được nhập tay trên Render lúc tạo Blueprint, không nằm trong Git.
services:
  - type: web
    name: mixue-beverageops-ai
    runtime: docker
    plan: starter
    region: singapore
    branch: fix/quality-improvement
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    # Chỉ deploy khi CI (test + Docker smoke) trên nhánh này đã pass.
    autoDeployTrigger: checksPass
    disk:
      name: mixue-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8501"
      - key: APP_ENV
        value: production
      - key: APP_DEMO_MODE
        value: "false"
      - key: PERSIST_DIR
        value: /var/data
      - key: TZ
        value: Asia/Ho_Chi_Minh
      # Lần đầu khởi động chỉ giữ dữ liệu nền (tài khoản, thực đơn, nguyên liệu, công thức); không có
      # doanh thu / kho / chốt ca mẫu. Đặt "true" nếu muốn giữ dữ liệu mẫu tháng 10/2026 để trình diễn.
      - key: KEEP_SAMPLE_DATA
        value: "false"
      - key: POSTGRES_MCP_ENABLED
        value: "false"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        # gemini-2.5-flash đã ngừng hoạt động từ 16/10/2026.
        value: gemini-3.5-flash
      - key: ALLOW_EXTERNAL_DATA_TRANSFER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_FULL_NAME
        sync: false
      - key: OWNER_INITIAL_PASSWORD
        sync: false
