# Render.com Blueprint cho BeverageOps AI — Chi nhánh Mixue 39 Tôn Quang Phiệt (CH 2132)
services:
  - type: web
    name: mixue-beverageops-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: APP_ENV
        value: development
      - key: APP_DEMO_MODE
        value: "true"
      - key: STORE_ID
        value: "2132"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: POSTGRES_MCP_ENABLED
        value: "false"
      - key: LLM_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: ALLOW_EXTERNAL_DATA_TRANSFER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
