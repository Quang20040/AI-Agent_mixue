# Render Blueprint — bản MIỄN PHÍ (0 đồng, không cần thẻ) để demo / bảo vệ đồ án.
#
# Giới hạn của gói Free trên Render (không đổi được):
# - Ngủ sau 15 phút không ai truy cập; lần mở tiếp theo chờ khoảng 1 phút.
# - Ổ đĩa tạm: mọi dữ liệu nhập thêm (báo cáo, ảnh, phê duyệt) bị xóa khi dịch vụ ngủ,
#   khởi động lại hoặc deploy lại; app quay về dữ liệu mẫu ngày 14–15/10/2026.
# => Dùng để DEMO. Dùng thật cho quán miễn phí: xem docs/DEPLOY_FREE.md (máy ở quán + Tailscale Funnel).
#    Bản trả phí có ổ đĩa bền vững: deploy/render-paid.yaml.
services:
  - type: web
    name: mixue-beverageops-demo
    runtime: docker
    plan: free
    region: singapore
    branch: fix/quality-improvement
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    # Chỉ deploy khi CI (test + Docker smoke) trên nhánh này đã pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8501"
      # Bật nút "Đăng nhập nhanh" tài khoản dùng thử để demo. Ai có link cũng vào được,
      # nhưng dữ liệu tự quay về bản mẫu sau mỗi lần dịch vụ ngủ.
      - key: APP_ENV
        value: development
      - key: APP_DEMO_MODE
        value: "true"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      # Lần đầu khởi động chỉ giữ dữ liệu nền (tài khoản, thực đơn, nguyên liệu, công thức); không có
      # doanh thu / kho / chốt ca mẫu. Đặt "true" nếu muốn giữ dữ liệu mẫu tháng 10/2026 để trình diễn.
      - key: KEEP_SAMPLE_DATA
        value: "false"
      - key: POSTGRES_MCP_ENABLED
        value: "false"
      # Tắt mặc định để người lạ không dùng hết hạn mức Gemini; bật "true" trước buổi demo.
      - key: LLM_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        # gemini-2.5-flash đã ngừng hoạt động từ 16/10/2026.
        value: gemini-3.5-flash
      - key: ALLOW_EXTERNAL_DATA_TRANSFER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
